services:
  - type: web
    name: vidstorm-m3u8-scraper
    runtime: python
    plan: free

    buildCommand: >
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      playwright install --with-deps chromium

    startCommand: >
      gunicorn app:app
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 120
      --keep-alive 5
      --access-logfile -
      --error-logfile -

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: ALLOWED_HOSTS
        value: "vidstorm.ru,www.vidstorm.ru"

      - key: PAGE_TIMEOUT
        value: "90000"

      - key: WAIT_AFTER_LOAD
        value: "5"

      # Optional:
      # Set this in Render Dashboard instead of putting
      # the actual secret in GitHub.
      #
      # - key: API_KEY
      #   sync: false

      # Optional:
      #
      # - key: CORS_ORIGINS
      #   value: "*"
